name: Artcraft checks
on:
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: artcraft-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      RUST_BACKTRACE: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Pinned official fonts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: storytold/craft-fonts
        ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
        path: craft-fonts
        persist-credentials: false
    - name: Pinned translation setup
      uses: storytold/craft-common-actions/actions/checkout-craft-i18n@8bb4e5ab95443171104ad88113fe1ef9b0e5ce3f
    - name: Linux dependencies (no persistent cache)
      env:
        PACKAGES: libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends $PACKAGES\n"
    - name: Rust with formatting, Clippy and WebAssembly
      shell: bash
      run: "set -euo pipefail\nchannel=stable\nif [ -f rust-toolchain.toml ]; then\n  channel=$(python3 -c 'import tomllib;
        print(tomllib.load(open(\"rust-toolchain.toml\", \"rb\"))[\"toolchain\"][\"channel\"])')\nfi\nrustup toolchain install
        \"$channel\" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown\nrustup default
        \"$channel\"\n"
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
      with:
        tool: cargo-nextest@0.9.150
    - name: Official project quality gate
      shell: bash
      run: cargo xtask ci
    - name: Lockfile unchanged
      run: git diff --exit-code -- Cargo.lock
  font-pin:
    runs-on: ubuntu-24.04
    env:
      # Same craft-fonts commit as release.yml.
      CRAFT_FONTS_REF: 37827adc41fd165f9a9234ac40f94dbad353aa69
    steps:
    - name: Check out craft-fonts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        repository: storytold/craft-fonts
        ref: ${{ env.CRAFT_FONTS_REF }}
        path: craft-fonts
    - name: Font pin gate
      env:
          # The only pin allowed to predate the reviewed Chinese manifest. It is a sentinel, not
          # a proposed future SHA; update it together with all three workflow pins.
        PENDING_CRAFT_FONTS_PIN: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
      run: |
        manifest="$GITHUB_WORKSPACE/craft-fonts/fonts/simplified-chinese-manifest.txt"
        if [ -f "$manifest" ]; then
          echo "craft-fonts pin carries the reviewed simplified-Chinese manifest."
        elif [ "$CRAFT_FONTS_REF" = "$PENDING_CRAFT_FONTS_PIN" ]; then
          echo "::warning title=craft-fonts pin pending::The pinned craft-fonts commit has no fonts/simplified-chinese-manifest.txt, so CJK checks may skip. Advance ci.yml, freebsd.yml and release.yml together to the reviewed immutable SHA before claiming shipped Chinese fonts."
        else
          echo "::error title=craft-fonts pin missing Chinese manifest::CRAFT_FONTS_REF advanced past the known pending pin ($PENDING_CRAFT_FONTS_PIN) but still has no fonts/simplified-chinese-manifest.txt. Update the pin to the reviewed commit that carries it."
          exit 1
        fi

    timeout-minutes: 90
